name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes sem serviço externo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Os testes do Neo4j, de LLM e do modelo de embeddings ficam de fora:
      # o CI não tem banco nem chaves, e baixar o modelo a cada execução é lento.
      - name: Rodar os testes
        run: python -m pytest -m "not neo4j and not llm and not modelo"