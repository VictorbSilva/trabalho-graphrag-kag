name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes sem serviço externo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # Os testes do Neo4j e de LLM ficam de fora: o CI não tem banco nem chaves.
      - name: Rodar os testes
        run: python -m pytest -m "not neo4j and not llm"
