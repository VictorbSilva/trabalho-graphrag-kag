[pytest]
testpaths = tests
pythonpath = .
addopts = -v -rs
markers =
    neo4j: precisa do Neo4j do docker-compose no ar (todo teste que usa a fixture driver recebe este marcador)
    llm: chama o LLM da Abacus; pulado automaticamente sem ABACUS_API_KEY no .env
    modelo: precisa do modelo de embeddings baixado (~470 MB)